name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git tag to build and publish, for example v1.1.0'
        required: true
        type: string

concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_version: ${{ steps.check.outputs.release_version }}
      major_minor: ${{ steps.check.outputs.major_minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          fetch-depth: 0

      - name: Verify tag commit is on main
        id: check
        shell: bash
        run: |
          release_ref="${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}"
          release_tag="${release_ref#refs/tags/}"

          if [[ "$release_tag" != v* ]]; then
            echo "::error::Docker release requires a v* tag, got $release_ref."
            exit 1
          fi

          if ! git rev-parse --verify "$release_tag^{commit}" >/dev/null; then
            echo "::error::Release tag $release_tag was not found."
            exit 1
          fi

          git fetch origin main --no-tags
          release_sha="$(git rev-parse "$release_tag^{commit}")"
          release_version="${release_tag#v}"
          major_minor="$(cut -d. -f1,2 <<< "$release_version")"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit $release_sha is not on origin/main, skip Docker build."
          fi

  build:
    name: Build ${{ matrix.platform }} image
    needs: precheck
    if: needs.precheck.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.precheck.outputs.release_tag }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Cargo build-cache mount
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: cargo-cache-mount
          key: cargo-cache-${{ matrix.arch }}-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-cache-${{ matrix.arch }}-v1-

      - name: Inject Cargo build-cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cargo-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.precheck.outputs.release_tag }}
            type=raw,value=${{ needs.precheck.outputs.release_version }}
            type=raw,value=${{ needs.precheck.outputs.major_minor }}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.platform }} image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            APP_DOCKER_VERSION=${{ needs.precheck.outputs.release_version }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${{ steps.build.outputs.digest }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-architecture manifest
    needs: [precheck, build]
    if: needs.precheck.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.precheck.outputs.release_tag }}
            type=raw,value=${{ needs.precheck.outputs.release_version }}
            type=raw,value=${{ needs.precheck.outputs.major_minor }}
            type=sha,prefix=sha-

      - name: Create and push multi-architecture manifest
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done <<< "$TAGS"

          images=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            digest="$(basename "$digest_file")"
            images+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$digest")
          done

          docker buildx imagetools create "${tags[@]}" "${images[@]}"
